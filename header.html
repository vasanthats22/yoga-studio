<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Yoga Studio - Navbar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
    }

    body {
      padding-top: 108px;
      min-height: 220vh;
      background: #F5F3EF;
    }

    /* ===== YOGA STUDIO NAVBAR — SAGE / CLAY / STONE ===== */
    .navbar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      border-radius: 22px;
      background: #ffffff;
      border: 1px solid #E2DFD8;
      box-shadow: 0 6px 22px rgba(94, 89, 80, 0.08);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .navbar.scrolled {
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(94, 89, 80, 0.14);
    }
    .navbar::after {
      content: '';
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 0;
      height: 2px;
      border-radius: 2px;
      background: #C17B5A;
      pointer-events: none;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
      gap: 18px;
      width: 100%;
    }

    /* LOGO */
    .logo-section {
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .logo-section:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }
    .logo-img {
      height: 62px;
      width: auto;
      object-fit: contain;
      display: block;
      filter: brightness(0) saturate(100%) invert(36%) sepia(18%) saturate(800%) hue-rotate(80deg) brightness(95%) contrast(88%);
    }

    /* NAV LINKS */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      flex: 1;
      justify-content: center;
      flex-wrap: nowrap;
    }
    .nav-link {
      background: none;
      border: none;
      padding: 0 0 3px 0;
      font-size: 0.88rem;
      font-weight: 600;
      color: #3A4A3F;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      white-space: nowrap;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-bottom: 2px solid transparent;
      text-decoration: none;
    }
    .nav-link i {
      color: #7A8B7E;
      font-size: 0.88rem;
      transition: 0.2s;
    }
    .nav-link:hover {
      color: #C17B5A;
      border-bottom-color: #C17B5A;
      transform: translateY(-2px);
    }
    .nav-link:hover i {
      color: #C17B5A;
    }

    /* RIGHT ACTIONS */
    .right-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .action-link {
      background: transparent;
      border: 1.5px solid #8F9E8A;
      padding: 0.42rem 1.15rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #5F6E5A;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      text-decoration: none;
    }
    .action-link i {
      color: #5F6E5A;
      font-size: 0.85rem;
    }

    .action-link.login-link {
      background: #C17B5A;
      border: 1.5px solid #C17B5A;
      color: #FFFFFF;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(193, 123, 90, 0.28);
    }
    .action-link.login-link i {
      color: #FFFFFF;
    }

    .action-link:hover {
      background: #7A8B7E;
      border-color: #7A8B7E;
      color: #fff;
      transform: scale(1.04);
    }
    .action-link:hover i {
      color: #fff;
    }

    .action-link.login-link:hover {
      background: #A55A3F;
      border-color: #A55A3F;
      color: #fff;
      transform: scale(1.04);
    }
    .action-link.login-link:hover i {
      color: #fff;
    }

    /* HAMBURGER */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
      padding: 6px;
      background: transparent;
      border: none;
      z-index: 1001;
    }
    .hamburger span {
      width: 24px;
      height: 2.2px;
      background: #7A8B7E;
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    .hamburger:hover span {
      background: #C17B5A;
    }
    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(6px, 6px);
      background: #C17B5A;
    }
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
      background: #C17B5A;
    }

    /* MOBILE MENU */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100vh;
      background: #F2EFE9;
      z-index: 999;
      transition: left 0.4s ease-in-out;
      overflow-y: auto;
      padding-top: 100px;
    }
    .mobile-menu.active {
      left: 0;
    }

    .mobile-nav-links {
      display: flex;
      flex-direction: column;
      padding: 16px 28px;
      gap: 8px;
    }
    .mobile-nav-link {
      background: none;
      border: none;
      padding: 12px 0;
      font-size: 1.05rem;
      font-weight: 600;
      color: #3A4A3F;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #E2DFD8;
      width: 100%;
      text-decoration: none;
    }
    .mobile-nav-link i {
      width: 28px;
      color: #7A8B7E;
      font-size: 1.05rem;
      transition: 0.2s;
    }
    .mobile-nav-link:hover {
      color: #C17B5A;
      transform: translateX(8px);
    }
    .mobile-nav-link:hover i {
      color: #C17B5A;
    }

    .mobile-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px 28px;
      margin-top: 16px;
      border-top: 1px solid #E2DFD8;
    }
    .mobile-action-link {
      background: transparent;
      border: 1.5px solid #8F9E8A;
      padding: 12px 0;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      color: #5F6E5A;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
    }
    .mobile-action-link i {
      color: #5F6E5A;
      font-size: 1rem;
    }
    .mobile-action-link:hover {
      background: #7A8B7E;
      border-color: #7A8B7E;
      color: #fff;
    }
    .mobile-action-link:hover i {
      color: #fff;
    }

    .mobile-action-link.login-mobile {
      background: #C17B5A;
      border-color: #C17B5A;
      color: #FFFFFF;
      font-weight: 700;
    }
    .mobile-action-link.login-mobile i {
      color: #FFFFFF;
    }
    .mobile-action-link.login-mobile:hover {
      background: #A55A3F;
      border-color: #A55A3F;
      color: #fff;
    }
    .mobile-action-link.login-mobile:hover i {
      color: #fff;
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .nav-links { gap: 14px; }
      .nav-link { font-size: 0.8rem; }
      .nav-link i { font-size: 0.8rem; }
      .logo-img { height: 56px; }
    }
    @media (max-width: 900px) {
      .nav-link span { display: none; }
      .nav-link { font-size: 1.05rem; gap: 0; }
      .nav-link i { font-size: 1.05rem; }
    }
    @media (max-width: 768px) {
      body { padding-top: 96px; }
      .navbar { top: 12px; left: 12px; right: 12px; border-radius: 18px; }
      .nav-container { padding: 0 16px; height: 68px; }
      .nav-links { display: none; }
      .right-actions { display: none; }
      .hamburger { display: flex; }
      .logo-img { height: 50px; }
      .mobile-menu { padding-top: 92px; }
    }
    @media (max-width: 480px) {
      body { padding-top: 88px; }
      .navbar { top: 10px; left: 10px; right: 10px; border-radius: 16px; }
      .nav-container { height: 62px; padding: 0 14px; }
      .logo-img { height: 46px; }
      .mobile-nav-link { font-size: 0.98rem; padding: 11px 0; }
      .mobile-nav-link i { font-size: 0.98rem; width: 26px; }
      .mobile-action-link { font-size: 0.95rem; padding: 11px 0; }
      .mobile-menu { padding-top: 84px; }
    }
  </style>
</head>
<body>

  <!-- ====== YOGA STUDIO NAVBAR ====== -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">

      <!-- LOGO (also links home) -->
      <a href="index.html" class="logo-section">
        <img src="stacklylogo1.webp" alt="Yoga Studio Logo" class="logo-img" />
      </a>

      <!-- 5 CENTER NAV LINKS: Home, Classes, Schedule, Pricing, Contact -->
      <div class="nav-links">
        <a href="index.html" class="nav-link"><i class="fas fa-house"></i> <span>Home</span></a>
        <a href="classes.html" class="nav-link"><i class="fas fa-person-praying"></i> <span>Classes</span></a>
        <a href="schedule.html" class="nav-link"><i class="fas fa-calendar-alt"></i> <span>Schedule</span></a>
        <a href="pricing.html" class="nav-link"><i class="fas fa-tag"></i> <span>Pricing</span></a>
        <a href="contact.html" class="nav-link"><i class="fas fa-envelope"></i> <span>Contact</span></a>
      </div>

      <!-- RIGHT: Signup + Login -->
      <div class="right-actions">
        <a href="signup.html" class="action-link">
          <i class="fas fa-user-plus"></i> Signup
        </a>
        <a href="login.html" class="action-link login-link">
          <i class="fas fa-right-to-bracket"></i> Login
        </a>
      </div>

      <!-- HAMBURGER -->
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

    </div>
  </nav>

  <!-- ====== MOBILE MENU ====== -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link"><i class="fas fa-house"></i> Home</a>
      <a href="classes.html" class="mobile-nav-link"><i class="fas fa-person-praying"></i> Classes</a>
      <a href="schedule.html" class="mobile-nav-link"><i class="fas fa-calendar-alt"></i> Schedule</a>
      <a href="pricing.html" class="mobile-nav-link"><i class="fas fa-tag"></i> Pricing</a>
      <a href="contact.html" class="mobile-nav-link"><i class="fas fa-envelope"></i> Contact</a>
    </div>

    <div class="mobile-actions">
      <a href="signup.html" class="mobile-action-link">
        <i class="fas fa-user-plus"></i> Signup
      </a>
      <a href="login.html" class="mobile-action-link login-mobile">
        <i class="fas fa-right-to-bracket"></i> Login
      </a>
    </div>
  </div>

  <!-- ====== JAVASCRIPT ====== -->
  <script>
    (function() {
      const navbar = document.getElementById('navbar');
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const mobileMenu = document.getElementById('mobileMenu');

      function handleScroll() {
        navbar.classList.toggle('scrolled', window.scrollY > 30);
      }
      window.addEventListener('scroll', handleScroll, { passive: true });
      handleScroll();

      function toggleMobileMenu() {
        hamburgerBtn.classList.toggle('active');
        mobileMenu.classList.toggle('active');
        document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
      }
      function closeMobileMenu() {
        hamburgerBtn.classList.remove('active');
        mobileMenu.classList.remove('active');
        document.body.style.overflow = '';
      }

      hamburgerBtn.addEventListener('click', toggleMobileMenu);
      document.querySelectorAll('.mobile-nav-link, .mobile-action-link').forEach(link => {
        link.addEventListener('click', closeMobileMenu);
      });
      document.addEventListener('click', function(e) {
        if (mobileMenu.classList.contains('active')) {
          if (!hamburgerBtn.contains(e.target) && !mobileMenu.contains(e.target)) closeMobileMenu();
        }
      });
      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) closeMobileMenu();
      });
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeMobileMenu();
      });
    })();
  </script>

</body>
</html>
